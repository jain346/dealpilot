<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DealPilot creator partnership intelligence" />
  <title>DealPilot</title>
  <style>
    :root { --ink:#172033; --muted:#6b7280; --line:#dbe3ec; --canvas:#f4f7fa; --navy:#102a43; --blue:#1565d8; --blue-dark:#0b4ca8; --cyan:#8de1df; --danger:#b42318; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; min-height:100vh; color:var(--ink); background:var(--canvas); font:15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; } button:disabled { cursor:not-allowed; opacity:.55; }
    .hidden { display:none !important; }
    .auth { min-height:100vh; display:grid; grid-template-columns:minmax(300px,.95fr) minmax(360px,1.05fr); }
    .hero { display:flex; flex-direction:column; justify-content:space-between; padding:clamp(34px,7vw,100px); color:#fff; background:radial-gradient(circle at 80% 18%,#287cf0 0,transparent 30%),linear-gradient(145deg,#0d253d,#123d64); }
    .logo { font-size:22px; font-weight:850; letter-spacing:-.8px; } .logo em { color:var(--cyan); font-style:normal; }
    .hero-copy { margin:auto 0; max-width:500px; } .eyebrow { margin:0 0 12px; color:#8cdefa; font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; }
    .hero h1 { max-width:520px; margin:0 0 18px; font-size:clamp(42px,5vw,70px); line-height:1.02; letter-spacing:-3px; } .hero p { max-width:440px; color:#c7d7e9; font-size:17px; }
    .auth-panel { width:min(100%,500px); margin:auto; padding:40px 32px; } .auth-panel h2 { margin:18px 0 6px; font-size:31px; letter-spacing:-1.2px; } .subtle { margin:0 0 28px; color:var(--muted); }
    .tabs { display:flex; gap:6px; padding:4px; border-radius:10px; background:#e6edf5; } .tab { flex:1; padding:10px; border:0; border-radius:7px; color:var(--muted); background:transparent; font-weight:750; } .tab.active { color:var(--ink); background:#fff; box-shadow:0 1px 3px #9fb1c433; }
    form { display:grid; gap:14px; } label { display:grid; gap:6px; color:#334155; font-size:13px; font-weight:750; } input { width:100%; padding:12px 13px; border:1px solid #cbd5e1; border-radius:8px; outline:0; background:#fff; } input:focus { border-color:var(--blue); box-shadow:0 0 0 3px #1664d920; }
    .primary { padding:12px 16px; border:0; border-radius:8px; color:#fff; background:var(--blue); font-weight:800; } .primary:hover { background:var(--blue-dark); } .form-message { min-height:20px; margin:2px 0 0; color:var(--danger); font-size:13px; }
    .app { min-height:100vh; display:grid; grid-template-columns:290px 1fr; } .sidebar { display:flex; min-width:0; flex-direction:column; overflow-y:auto; padding:26px 20px; color:#dce9f6; background:var(--navy); } .sidebar .logo { color:#fff; }
    .product-note { margin:42px 0 18px; color:#a9bfd4; font-size:13px; } .new-chat { width:100%; padding:11px; border:1px solid #41617f; border-radius:8px; color:#fff; background:#1c405f; font-weight:750; text-align:left; } .new-chat:hover { background:#285575; }
    .profile { margin-top:18px; padding:14px; border:1px solid #365674; border-radius:10px; background:#153552; } .profile-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:10px; color:#fff; font-size:13px; } .profile-progress { color:#f7cf88; font-size:11px; }
    .profile-form { gap:9px; } .profile-form label { gap:4px; color:#b9d3ea; font-size:11px; } .profile-form input { padding:7px 8px; border-color:#41617f; border-radius:6px; color:#fff; background:#102a43; font-size:12px; } .profile-form input::placeholder { color:#7896ae; } .profile-save { padding:8px; border:0; border-radius:6px; color:#102039; background:var(--cyan); font-size:12px; font-weight:800; } .profile-message { min-height:16px; margin:0; color:#9fe0bf; font-size:11px; }
    .history { max-height:280px; margin-top:18px; overflow:auto; } .history-label { margin:0 0 6px; color:#7ea0bf; font-size:11px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; } .history-item { width:100%; overflow:hidden; padding:8px; border:0; border-radius:6px; color:#b9d3ea; background:transparent; font-size:12px; text-align:left; text-overflow:ellipsis; white-space:nowrap; } .history-item:hover,.history-item.active { color:#fff; background:#1c405f; }
    .account { margin-top:auto; padding-top:18px; border-top:1px solid #365674; } .account-name { color:#fff; font-weight:800; } .account-email { overflow:hidden; margin:2px 0 12px; color:#a9bfd4; font-size:12px; text-overflow:ellipsis; white-space:nowrap; } .logout { padding:0; border:0; color:#b9d3ea; background:none; text-decoration:underline; }
    .chat { display:flex; min-width:0; flex-direction:column; } .chat-header { display:flex; align-items:center; justify-content:space-between; padding:20px clamp(20px,5vw,52px); border-bottom:1px solid var(--line); background:#ffffffd9; } .chat-header h1 { margin:0; font-size:18px; } .status { display:flex; align-items:center; gap:7px; color:#557087; font-size:12px; } .dot { width:8px; height:8px; border-radius:50%; background:#22a06b; }
    .messages { width:min(900px,100%); flex:1; margin:0 auto; padding:32px clamp(20px,5vw,52px); } .welcome { max-width:650px; margin:7vh auto; } .welcome h2 { max-width:530px; margin:0 0 12px; font-size:clamp(31px,4vw,48px); line-height:1.06; letter-spacing:-2px; } .welcome p { max-width:520px; color:var(--muted); font-size:17px; }
    .suggestions { display:flex; flex-wrap:wrap; gap:9px; margin-top:28px; } .suggestion { padding:9px 12px; border:1px solid #cbd9e8; border-radius:99px; color:#244c72; background:#fff; font-size:13px; } .suggestion:hover { border-color:var(--blue); color:var(--blue); }
    .message { max-width:760px; margin:0 auto 22px; } .message-label { margin-bottom:5px; color:var(--muted); font-size:12px; font-weight:800; } .bubble { padding:14px 16px; border-radius:4px 14px 14px 14px; background:#fff; box-shadow:0 1px 2px #10203910; overflow-wrap:anywhere; } .bubble p { margin:0 0 .8em; } .bubble p:last-child { margin-bottom:0; } .bubble a { color:#0d4eae; } .bubble ul,.bubble ol { margin:0 0 .8em 1.1em; padding-left:1.1em; } .bubble code { padding:2px 6px; border-radius:5px; background:#edf3ff; font-family:ui-monospace,monospace; font-size:.9em; } .message.user .message-label { text-align:right; } .message.user .bubble { margin-left:auto; border-radius:14px 4px 14px 14px; color:#fff; background:var(--blue); } .message.user .bubble a { color:#e0edff; }
    .composer-wrap { padding:18px clamp(20px,5vw,52px) 27px; background:linear-gradient(transparent,var(--canvas) 25%); } .composer { display:flex; gap:10px; width:min(900px,100%); margin:auto; padding:8px; border:1px solid #cbd9e8; border-radius:12px; background:#fff; box-shadow:0 6px 24px #0d253d0d; } .composer input { border:0; box-shadow:none; } .send { min-width:72px; padding:0 14px; border:0; border-radius:8px; color:#fff; background:var(--blue); font-weight:800; }
    @media (max-width:720px) { .auth { grid-template-columns:1fr; } .hero { min-height:280px; padding:30px; } .hero-copy { margin:50px 0 0; } .hero h1 { font-size:42px; } .auth-panel { padding:34px 24px; } .app { grid-template-columns:1fr; } .sidebar { display:none; } .chat-header { padding:16px 20px; } .messages { padding-top:20px; } .composer-wrap { padding:14px 20px 20px; } }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useState } = React;
    const store = { token:'dealpilot.token', session:'dealpilot.session', user:'dealpilot.user' };
    const api = async (path, options = {}) => {
      const response = await fetch(path, { ...options, headers: { ...(options.body ? {'Content-Type':'application/json'} : {}), ...(options.headers || {}) } });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || 'Something went wrong. Please try again.');
      return body;
    };
    const authHeaders = () => ({ Authorization:`Bearer ${localStorage.getItem(store.token)}` });
    const emptyProfile = { creator_name:'', niche:'', platforms:[], region:'', audience_size:'', average_views:'', engagement_rate:'' };
    const profilePayload = profile => ({
      creator_name: profile.creator_name || null,
      niche: profile.niche || null,
      platforms: profile.platforms,
      region: profile.region || null,
      audience_size: profile.audience_size === '' ? null : Number(profile.audience_size),
      average_views: profile.average_views === '' ? null : Number(profile.average_views),
      engagement_rate: profile.engagement_rate === '' ? null : Number(profile.engagement_rate),
    });
    function escapeHtml(value) { return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function renderMarkdown(markdown = '') {
      const blocks = String(markdown).replace(/\r\n/g,'\n').trim().split(/\n{2,}/).filter(Boolean);
      return blocks.map(block => {
        const lines = block.split('\n');
        if (lines.every(line => /^[-*]\s+/.test(line))) return `<ul>${lines.map(line => `<li>${inlineMarkdown(line.replace(/^[-*]\s+/,''))}</li>`).join('')}</ul>`;
        if (lines.every(line => /^\d+\.\s+/.test(line))) return `<ol>${lines.map(line => `<li>${inlineMarkdown(line.replace(/^\d+\.\s+/,''))}</li>`).join('')}</ol>`;
        return `<p>${inlineMarkdown(block)}</p>`;
      }).join('') || '<p></p>';
    }
    function inlineMarkdown(value) {
      return escapeHtml(value).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/_([^_]+)_/g,'<em>$1</em>').replace(/(https?:\/\/[^\s<>'")\]]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g,'<br>');
    }
    function responseText(response) { return typeof response === 'string' ? response : (response?.markdown || response?.text || ''); }

    function AuthView({ onLogin }) {
      const [mode, setMode] = useState('login'); const [form, setForm] = useState({username:'',email:'',password:''}); const [error, setError] = useState(''); const [busy, setBusy] = useState(false);
      const update = event => setForm({...form, [event.target.name]:event.target.value});
      const submit = async event => { event.preventDefault(); setBusy(true); setError(''); try { if (mode === 'signup') await api('/auth/signup',{method:'POST',body:JSON.stringify({username:form.username.trim(),email:form.email.trim() || null,password:form.password})}); const login = await api('/auth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:form.username.trim(),password:form.password})}); localStorage.setItem(store.token,login.access_token); const user = await api('/auth/me',{headers:{Authorization:`Bearer ${login.access_token}`}}); localStorage.setItem(store.user,JSON.stringify(user)); onLogin(user); } catch (err) { setError(err.message); } finally { setBusy(false); } };
      return <section className="auth"><aside className="hero"><div className="logo">Deal<em>Pilot</em></div><div className="hero-copy"><p className="eyebrow">Creator partnership intelligence</p><h1>Find the next right deal.</h1><p>Research brands, surface timely opportunities, and make confident partnership decisions with an agent built for creators.</p></div><small>Private, account-based agent workspace</small></aside><main className="auth-panel"><div className="tabs"><button className={mode === 'login' ? 'tab active':'tab'} onClick={() => setMode('login')}>Log in</button><button className={mode === 'signup' ? 'tab active':'tab'} onClick={() => setMode('signup')}>Create account</button></div><h2>{mode === 'signup' ? 'Create your workspace':'Welcome back'}</h2><p className="subtle">{mode === 'signup' ? 'Start researching your next brand partnership.':'Log in to your DealPilot workspace.'}</p><form onSubmit={submit}><label>Username<input name="username" value={form.username} onChange={update} autoComplete="username" required /></label>{mode === 'signup' && <label>Email<input name="email" type="email" value={form.email} onChange={update} autoComplete="email" /></label>}<label>Password<input name="password" type="password" value={form.password} onChange={update} autoComplete={mode === 'signup' ? 'new-password':'current-password'} minLength="8" required /></label><button className="primary" disabled={busy}>{busy ? 'Working…' : mode === 'signup' ? 'Create account':'Log in'}</button><p className="form-message" role="alert">{error}</p></form></main></section>;
    }

    function ProfilePanel({ profile, setProfile }) {
      const [message, setMessage] = useState(''); const [busy, setBusy] = useState(false);
      const update = event => setProfile({...profile,[event.target.name]:event.target.value});
      const save = async event => { event.preventDefault(); setBusy(true); setMessage('Saving…'); try { const saved = await api('/agent/profile',{method:'PATCH',headers:authHeaders(),body:JSON.stringify(profilePayload(profile))}); setProfile({...saved, audience_size:saved.audience_size ?? '',average_views:saved.average_views ?? '',engagement_rate:saved.engagement_rate ?? ''}); setMessage('Profile saved'); } catch (err) { setMessage(err.message); } finally { setBusy(false); } };
      const complete = [profile.niche,profile.platforms?.length,profile.region].filter(Boolean).length;
      return <section className="profile"><div className="profile-head"><strong>Creator profile</strong><span className="profile-progress" style={{color:complete === 3 ? '#9fe0bf':'#f7cf88'}}>{complete}/3 required</span></div><form className="profile-form" onSubmit={save}><label>Creator name<input name="creator_name" value={profile.creator_name || ''} onChange={update} placeholder="Optional" /></label><label>Niche<input name="niche" value={profile.niche || ''} onChange={update} placeholder="Required" /></label><label>Platforms<input name="platforms" value={(profile.platforms || []).join(', ')} onChange={event => setProfile({...profile,platforms:event.target.value.split(',').map(value => value.trim()).filter(Boolean)})} placeholder="YouTube, TikTok" /></label><label>Region<input name="region" value={profile.region || ''} onChange={update} placeholder="Required" /></label><label>Audience size<input name="audience_size" type="number" min="0" value={profile.audience_size} onChange={update} placeholder="Optional" /></label><label>Average views<input name="average_views" type="number" min="0" value={profile.average_views} onChange={update} placeholder="Optional" /></label><label>Engagement rate (%)<input name="engagement_rate" type="number" min="0" step="0.01" value={profile.engagement_rate} onChange={update} placeholder="Optional" /></label><button className="profile-save" disabled={busy}>{busy ? 'Saving…':'Save profile'}</button><p className="profile-message" role="status">{message}</p></form></section>;
    }

    function Chat({ profile, onLogout }) {
      const [session, setSession] = useState(localStorage.getItem(store.session)); const [history, setHistory] = useState([]); const [messages, setMessages] = useState([]); const [input, setInput] = useState(''); const [busy, setBusy] = useState(false);
      const loadSessions = async () => { try { setHistory(await api('/agent/sessions',{headers:authHeaders()})); } catch {} };
      const loadMessages = async id => { if (!id) return; try { const saved = await api(`/agent/sessions/${encodeURIComponent(id)}/messages`,{headers:authHeaders()}); setMessages(saved); } catch { localStorage.removeItem(store.session); setSession(null); } };
      useEffect(() => { loadSessions(); loadMessages(session); }, []);
      const chooseSession = id => { localStorage.setItem(store.session,id); setSession(id); loadMessages(id); };
      const newChat = () => { localStorage.removeItem(store.session); setSession(null); setMessages([]); };
      const send = async value => { const text = value.trim(); if (!text || busy) return; setInput(''); setMessages(current => [...current,{role:'user',content:text},{role:'assistant',content:'Researching…'}]); setBusy(true); try { let id = session; if (!id) { const created = await api('/agent/sessions',{method:'POST',headers:authHeaders()}); id = created.session_id; localStorage.setItem(store.session,id); setSession(id); } const body = await api(`/agent/sessions/${encodeURIComponent(id)}/messages`,{method:'POST',headers:authHeaders(),body:JSON.stringify({message:text})}); setMessages(current => [...current.slice(0,-1),{role:'assistant',content:responseText(body.response)}]); loadSessions(); } catch (err) { setMessages(current => [...current.slice(0,-1),{role:'assistant',content:`Unable to reach DealPilot: ${err.message}`}]); } finally { setBusy(false); } };
      return <main className="chat"><header className="chat-header"><h1>DealPilot Agent</h1><div className="status"><span className="dot" />Ready to research <button className="logout" onClick={onLogout}>Log out</button></div></header><div className="messages">{messages.length === 0 ? <div className="welcome"><p className="eyebrow">Your deal desk</p><h2>What partnership opportunity can I help with?</h2><p>Ask about sponsors, creator campaigns, affiliate programs, or a brand you want to understand.</p><div className="suggestions"><button className="suggestion" onClick={() => send('Find sponsorship opportunities in fitness')}>Find sponsorship opportunities in fitness</button><button className="suggestion" onClick={() => send('Research a brand for me')}>Research a brand for me</button><button className="suggestion" onClick={() => send('Evaluate a partnership fit')}>Evaluate a partnership fit</button></div></div> : messages.map((message,index) => <article className={`message ${message.role}`} key={`${message.created_at || index}-${index}`}><div className="message-label">{message.role === 'user' ? 'You':'DealPilot'}</div><div className="bubble">{message.role === 'assistant' ? <span dangerouslySetInnerHTML={{__html:renderMarkdown(responseText(message.content))}} /> : message.content}</div></article>)}</div><div className="composer-wrap"><form className="composer" onSubmit={event => {event.preventDefault();send(input)}}><input value={input} onChange={event => setInput(event.target.value)} placeholder="Ask DealPilot anything…" maxLength="20000" disabled={busy} /><button className="send" disabled={busy || !input.trim()}>Send</button></form></div></main>;
    }

    function App() {
      const [user,setUser] = useState(null); const [profile,setProfile] = useState(emptyProfile); const [loading,setLoading] = useState(true);
      const logout = () => { localStorage.clear(); setUser(null); setProfile(emptyProfile); };
      const loadProfile = async () => { try { const saved = await api('/agent/profile',{headers:authHeaders()}); setProfile({...saved,audience_size:saved.audience_size ?? '',average_views:saved.average_views ?? '',engagement_rate:saved.engagement_rate ?? ''}); } catch {} };
      useEffect(() => { const token = localStorage.getItem(store.token); if (!token) { setLoading(false); return; } api('/auth/me',{headers:{Authorization:`Bearer ${token}`}}).then(current => { localStorage.setItem(store.user,JSON.stringify(current)); setUser(current); return loadProfile(); }).catch(() => localStorage.clear()).finally(() => setLoading(false)); }, []);
      if (loading) return <div className="auth-panel"><p className="subtle">Loading DealPilot…</p></div>;
      if (!user) return <AuthView onLogin={current => { setUser(current); loadProfile(); }} />;
      return <section className="app"><aside className="sidebar"><div className="logo">Deal<em>Pilot</em></div><p className="product-note">Your private partnership intelligence workspace.</p><button className="new-chat" onClick={() => window.dispatchEvent(new Event('dealpilot:new-chat'))}>＋ New conversation</button><ProfilePanel profile={profile} setProfile={setProfile} /><div className="history"><p className="history-label">Saved conversations</p><ConversationList onSelect={id => window.dispatchEvent(new CustomEvent('dealpilot:select-session',{detail:id}))} /></div><div className="account"><div className="account-name">{user.username}</div><div className="account-email">{user.email || 'DealPilot member'}</div><button className="logout" onClick={logout}>Log out</button></div></aside><ChatBridge onLogout={logout} /></section>;
    }
    function ConversationList({onSelect}) { const [items,setItems] = useState([]); useEffect(() => { const load = () => api('/agent/sessions',{headers:authHeaders()}).then(setItems).catch(() => {}); load(); window.addEventListener('dealpilot:refresh-sessions',load); return () => window.removeEventListener('dealpilot:refresh-sessions',load); },[]); return items.map(item => <button className={`history-item ${item.session_id === localStorage.getItem(store.session) ? 'active':''}`} key={item.session_id} onClick={() => onSelect(item.session_id)}>Conversation · {new Date(item.created_at).toLocaleString()}</button>); }
    function ChatBridge({onLogout}) { const [key,setKey] = useState(0); useEffect(() => { const fresh = () => setKey(value => value + 1); const select = event => { localStorage.setItem(store.session,event.detail); setKey(value => value + 1); }; window.addEventListener('dealpilot:new-chat',fresh); window.addEventListener('dealpilot:select-session',select); return () => { window.removeEventListener('dealpilot:new-chat',fresh); window.removeEventListener('dealpilot:select-session',select); }; },[]); return <Chat key={key} onLogout={onLogout} />; }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
